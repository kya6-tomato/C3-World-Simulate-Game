name: 世界を1ターン進める

on:
  schedule:
    - cron: "0 0,4,8,12 * * *" # JST 9/13/17/21時（UTCは9時間引いた値）
  workflow_dispatch: # 部会などでの手動実行ボタン

permissions:
  contents: write
  issues: write

# 手動実行とスケジュール実行が重なっても、同時に2つ動いて
# 状態がぶつからないようにする。
concurrency:
  group: world-turn
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 1ターン進める
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAME_DIR: game
        run: node sim/github-turn.ts

      - name: 進行状況を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game/
          git diff --cached --quiet || git commit -m "ターン自動進行"
          git push
