name: 更新前リマインダー

on:
  schedule:
    # 次のターン更新（JST 9/13/17/21時）の1時間前（JST 8/12/16/20時）。
    # UTCはJSTから9時間引いた値（分はずれない）。
    - cron: "0 23,3,7,11 * * *"
    # 10分前（JST 8:50/12:50/16:50/20:50時）。
    - cron: "50 23,3,7,11 * * *"
  workflow_dispatch: # 手動実行ボタン（動作確認用）

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: リマインダーを投稿する
        env:
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}
        run: node sim/reminder.ts
