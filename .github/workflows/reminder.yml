name: 更新前リマインダー

on:
  schedule:
    # 次のターン更新（JST 9/13/17/21時）のおよそ1時間前。
    # UTCはJSTから9時間引いた値。「0分」ちょうどはGitHub全体で
    # 実行が集中しやすく、遅延の原因になっていたため、あえて
    # ちょうどでない分（6分）にずらしてある。実際の残り時間は
    # reminder.ts側で毎回計算し直すので、この数分のずれ自体は
    # 表示に影響しない。
    - cron: "6 23,3,7,11 * * *"
    # 次のターン更新のおよそ20分前（旧: 10分前）。
    # 遅延が発生しても更新後に投稿してしまわないよう、余裕を広げてある。
    # こちらも「50分」ちょうどを避けて38分にしてある。
    - cron: "38 23,3,7,11 * * *"
  workflow_dispatch: # 手動実行ボタン（動作確認用）

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: リマインダーを投稿する
        env:
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}
        run: node sim/reminder.ts
